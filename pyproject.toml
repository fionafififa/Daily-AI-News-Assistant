[project]
name = "daily-ai-news-agent"
version = "0.1.0"
description = "A small, inspectable daily AI news agent built with LangChain create_agent and FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.13,<5",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
  "sqlalchemy>=2.1.6",
  "psycopg[binary]>=3.3.6",
  "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright>=1.50,<2", "aiosmtpd>=1.4,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

